{% extends 'base.html' %}

{% block title %}DevSpace | 글쓰기{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-8">
        <div class="card shadow p-4">
            <h2 class="fw-bold mb-4">✏️ 글쓰기</h2>
            
            <form method="post">
                {% csrf_token %}
                
                <!-- 👇 이 부분이 빠져있으면 입력창이 나타나지 않습니다! -->
                <div class="mb-3">
                    {{ form.as_p }}
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <button type="submit" class="btn btn-primary px-4 fw-bold">저장하기</button>
                    <a href="{% url 'board:post_list' %}" class="btn btn-outline-secondary px-4 fw-bold">취소</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
