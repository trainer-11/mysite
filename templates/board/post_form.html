{% extends 'base.html' %}

{% block title %}DevSpace | 글쓰기{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-8">
        <div class="card shadow p-4">
            <h2 class="fw-bold mb-4">✏️ 글쓰기</h2>
            
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                
                <!-- 👇 [추가] 카테고리를 선택할 수 있는 드롭다운 메뉴 -->
                <div class="mb-3">
                    <label for="category" class="form-label fw-bold">게시판(카테고리)</label>
                    <select name="category" id="category" class="form-select">
                        <option value="">카테고리 선택</option>
                        {% for category in categories %}
                            <option value="{{ category.pk }}" {% if post.category == category %}selected{% endif %}>
                                {{ category.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    {{ form.as_p }}
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <button type="submit" class="btn btn-primary px-4 fw-bold">저장하기</button>
                    <a href="{% url 'board:post_list' %}" class="btn btn-outline-secondary px-4 fw-bold">취소</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
