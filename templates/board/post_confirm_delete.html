{% extends 'base.html' %}

{% block title %}게시글 삭제{% endblock %}

{% block content %}
<div class="card">
    <h1>게시글 삭제</h1>

    <p>정말로 다음 게시글을 삭제하시겠습니까?</p>
    <p><strong>{{ post.title }}</strong></p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">삭제하기</button>
        <a href="{% url 'board:detail' post.pk %}">취소</a>
    </form>
</div>
{% endblock %}
