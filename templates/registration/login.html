{% extends 'base.html' %}

{% block title %}로그인{% endblock %}

{% block content %}
<div class="card">
    <h1>로그인</h1>

    {% if form.errors %}
    <p>아이디 또는 비밀번호를 확인해 주세요.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">로그인</button>
    </form>

    <p>
        계정이 없으신가요?
        <a href="{% url 'accounts:signup' %}">회원가입</a>
    </p>
</div>
{% endblock %}
